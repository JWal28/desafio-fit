<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desafio Fit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app. Cycle card, ranking cards, per-day grid, fixed bottom tab bar. */
:root{
  color-scheme:light;
  --bg:#F2F1F6; --surface:#FFFFFF; --surface2:#E9E7F1; --ink:#1D1A2B; --ink2:#5C5870; --line:#DAD7E6;
  --accent:#B3245F; --accent-ink:#FFFFFF;
  --ok:#17895F; --ok-bg:#D8F1E6; --miss:#C93B3B; --miss-bg:#F8DADA; --warn:#A8660F; --warn-bg:#FBEBCB;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151322; --surface:#1F1C30; --surface2:#2A2640; --ink:#EFEDF8; --ink2:#A6A1BD; --line:#38334F;
    --accent:#F0679B; --accent-ink:#2A0716;
    --ok:#4FD1A0; --ok-bg:#17382E; --miss:#FF7A7A; --miss-bg:#402027; --warn:#F2B44D; --warn-bg:#3B2E14;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;flex-direction:column;gap:2px;padding:4px 2px 2px}
.top h1{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.sub{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
h2{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:17px}
.big{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rank{font-family:var(--font-display);font-weight:800;font-size:20px;width:30px;color:var(--ink2);font-variant-numeric:tabular-nums}
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;color:#fff;font-family:var(--font-display);font-weight:800;font-size:18px;flex:none}
.pts{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.pts small{display:block;font-family:var(--font-body);font-weight:600;font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);border:0;font-family:inherit}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.miss{background:var(--miss-bg);color:var(--miss)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
button.chip{cursor:pointer;padding:7px 13px;font-size:14px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--surface2);opacity:.55}
.cell.ok{background:var(--ok);opacity:1}
.cell.miss{background:var(--miss);opacity:1}
.cell.today{outline:2px solid var(--warn);outline-offset:1px;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--surface2)}
.legend i.ok{background:var(--ok)}.legend i.miss{background:var(--miss)}.legend i.today{outline:2px solid var(--warn);outline-offset:1px}
.prize{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.prize .eyebrow{color:inherit;opacity:.85}
.prize p{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--miss);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
input[type=text],input[type=number],input[type=date],textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:96px}
pre.code{margin:0;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:12px;overflow-x:auto;white-space:pre}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-h{display:flex;flex-direction:column}
.hint{font-size:12px;color:var(--ink2)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--surface2);display:block}
.ph.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:12px;border:1.5px dashed var(--line);background:transparent}
.ph.empty svg{width:26px;height:26px}
img.ph{cursor:zoom-in}
.cell.part{background:var(--warn);opacity:1}
.legend i.part{background:var(--warn)}
.phw{position:relative;min-width:0}
.tm{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.lbt{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.banner{border-radius:12px;padding:12px 14px;font-weight:600}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.miss{background:var(--miss-bg);color:var(--miss)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav .btn{min-width:44px;padding:10px 14px}
ul.rules,ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
svg{flex:none}
@media (max-width:380px){.pts{font-size:32px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.top{flex-direction:row;align-items:center;gap:12px}
.top .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.profbtn{border:0;background:transparent;padding:0;cursor:pointer;position:relative;flex:none;border-radius:50%;line-height:0}
.profbtn::after{content:'\21C4';position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;text-align:center;border:2px solid var(--bg)}
.profbtn:focus-visible,.chrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img.av{object-fit:cover;background:var(--surface2)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.chrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:56px}
.chrow[aria-current="true"]{border-color:var(--accent)}
.chemo{font-size:24px;line-height:1;flex:none}
.nav-in{grid-template-columns:repeat(5,1fr)}
.tab{font-size:11px}
.inv{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:99px;background:var(--miss);color:#fff;font-size:12px;font-weight:600;pointer-events:none}
.votes{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sbar{display:flex;gap:2px;height:16px}
.sbar i{display:block;height:100%;border-radius:4px;min-width:4px}
.hb{display:flex;align-items:center;gap:8px;min-width:0}
.hb .hl{width:84px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .hv{flex:1;min-width:0}
.hbar{height:12px;border-radius:4px;background:var(--accent);min-width:3px}
.hn{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2);flex:none;min-width:24px;text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.lg i.sq{height:10px;width:10px;border-radius:3px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}
.chartsvg{width:100%;height:auto;display:block}
.chartsvg text{fill:var(--ink2);font-size:10px;font-family:var(--font-body)}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600}
</style>
</head>
<body>
<div id="app" class="wrap" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
var COLORS=['#B3245F','#2A6FDB','#17895F','#D9822B','#7A4FD6','#0F8F9E','#E02424'];
var TYPES=['Academia','Em casa','Corrida','Outro'];
var DEF={start:'2026-11-16',months:2,stake:50,penalty:10,startPoints:100,requireMeal:true};
var TYPEDEF={
  fit:{label:'Academia e alimentação',emo:'🏋️',money:true,k:['w','m'],names:['Treino','Refeição saudável'],miss:['foto do treino','foto da refeição'],hints:['Academia, casa ou onde for',''],
    hello:'Vamos treinar?',legendOk:'Treino registrado',partTxt:'Só uma foto',notePh:'Ex.: treino de perna, 45 min',def:DEF,
    about:'Foto do treino e de uma refeição saudável por dia. Quem perder paga a aposta.'},
  refeicoes:{label:'Almoço e jantar',emo:'🍽️',money:false,k:['a','j'],names:['Almoço','Jantar'],miss:['foto do almoço','foto do jantar'],hints:['Foto do prato','Foto do prato'],
    hello:'Bora comer bem?',legendOk:'Almoço e jantar enviados',partTxt:'Só uma refeição',notePh:'Ex.: salada com frango grelhado',
    def:{start:'',months:1,stake:0,penalty:10,startPoints:100,requireMeal:true},
    about:'Foto do almoço e do jantar todo dia. É só por diversão, sem dinheiro.'}
};
var WD=['dom','seg','ter','qua','qui','sex','sáb'];
var RULES_TXT="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";
var ICON={
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a2 2 0 0 0 2 4M16 6h3a2 2 0 0 1-2 4M12 13v4M8 20h8M10 17h4"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>'
};
var FBCFG=null;
var S={db:null,uid:null,players:{},metas:{},cfg:null,tab:'placar',galDate:null,loaded:{players:false,cfg:false},
  err:null,busy:{},toast:'',confirmNew:false,newColor:COLORS[0],pColor:null,setupErr:'',oldLink:false,votes:{},sheet:false,sheetView:'main',confirmLeave:false,newName:'',newType:'refeicoes',joinText:''};
var CH=null,LIST=[],unsubs=[];
var photoCache=new Map(),subs={},pending=false,toastT=null,metaQueue=Promise.resolve(),lastDay='';

function h(t,a){
  var e=document.createElement(t);
  if(a)for(var n in a){var v=a[n];if(v==null||v===false)continue;
    if(n==='class')e.className=v;
    else if(n==='value')e.value=v;
    else if(n==='checked')e.checked=true;
    else if(n.slice(0,2)==='on')e.addEventListener(n.slice(2),v);
    else e.setAttribute(n,v===true?'':v);}
  (function add(x){
    if(x==null||x===false)return;
    if(Array.isArray(x)){x.forEach(add);return}
    if(x.nodeType){e.appendChild(x);return}
    e.appendChild(document.createTextNode(String(x)));
  })(Array.prototype.slice.call(arguments,2));
  return e;
}
function icon(n){var s=document.createElement('span');s.innerHTML=ICON[n];return s.firstChild}

/* dates */
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return key(new Date())}
function toD(k){var p=k.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]))}
function fromD(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDays(k,n){var d=toD(k);d.setUTCDate(d.getUTCDate()+n);return fromD(d)}
function diff(a,b){return Math.round((toD(b)-toD(a))/864e5)}
function fmt(k){var p=k.split('-');return p[2]+'/'+p[1]}
function wd(k){return WD[toD(k).getUTCDay()]}
function TY(){return TYPEDEF[(S.cfg&&S.cfg.type)||(entry(CH)||{}).type]||TYPEDEF.fit}
function P(p){return CH?'desafios/'+CH+'/'+p:p}
function cfg(){var c=Object.assign({},TY().def,S.cfg||{});['months','stake','penalty','startPoints'].forEach(function(f){c[f]=Number(c[f])});return c}
function cycleEnd(c){var d=toD(c.start);d.setUTCMonth(d.getUTCMonth()+c.months);d.setUTCDate(d.getUTCDate()-1);return fromD(d)}
function money(n){return 'R$ '+n.toLocaleString('pt-BR')}

/* scoring */
function valid(m,c){var k=TY().k;return !!(m&&m[k[0]]&&(!c.requireMeal||m[k[1]]))}
/* penalidade do dia: 0 com as duas fotos, metade com só uma, cheia sem nenhuma */
function dayPenalty(m,c){
  var k=TY().k,a=!!(m&&m[k[0]]),b=!!(m&&m[k[1]]);
  if(!c.requireMeal)return a?0:c.penalty;
  if(a&&b)return 0;
  if(a||b)return c.penalty/2;
  return c.penalty;
}
function eligible(owner,d){return Object.keys(S.players).filter(function(id){return id!==owner})}
/* foto invalidada: todas as outras pessoas votaram para invalidar (minimo 2 votantes). Sem votos = valida. */
function invalid(owner,d,kind){
  var el=eligible(owner,d);if(el.length<2)return false;
  var v=S.votes[d+'_'+kind+'_'+owner]||{};
  return el.every(function(i){return v[i]===true});
}
function eff(uid,d){
  var m=(S.metas[uid]||{})[d];if(!m)return m;
  var o=Object.assign({},m);TY().k.forEach(function(x){if(o[x]&&invalid(uid,d,x))o[x]=false});return o;
}
function num(n){return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function stats(uid){
  var c=cfg(),p=S.players[uid]||{},metas=S.metas[uid]||{},t=today(),end=cycleEnd(c);
  var from=p.joined&&p.joined>c.start?p.joined:c.start;
  var y=addDays(t,-1),lastPen=y<end?y:end,missed=[],lost=0,done=0,d,pen;
  for(d=from;d<=lastPen;d=addDays(d,1)){
    pen=dayPenalty(eff(uid,d),c);
    if(pen===0)done++;else{missed.push({d:d,p:pen});lost+=pen}
  }
  var todayOk=t>=from&&t<=end&&valid(eff(uid,t),c);
  if(todayOk)done++;
  var s=0;d=todayOk?t:y;if(d>end)d=end;
  while(d>=from&&valid(eff(uid,d),c)){s++;d=addDays(d,-1)}
  return {points:Math.max(0,c.startPoints-lost),missed:missed,done:done,streak:s,todayOk:todayOk,from:from};
}
function phase(c,t,end){return t<c.start?'before':(t>end?'after':'running')}
function color(p){return COLORS.indexOf(p&&p.color)>=0?p.color:COLORS[0]}
function avatar(p,size){
  var st=size?'width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.45)+'px':'';
  if(p&&p.av)return h('img',{class:'av',src:p.av,alt:'',style:st});
  return h('span',{class:'av',style:'background:'+color(p)+(st?';'+st:'')},((p&&p.name)||'?').trim().slice(0,1).toUpperCase());
}

/* ui helpers */
function toast(msg){S.toast=msg;render(true);clearTimeout(toastT);toastT=setTimeout(function(){S.toast='';render(true)},3000)}

function copyText(text,box){
  function sel(){if(box){box.focus();box.select()}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Copiado')}).catch(sel)}else sel();
}

/* firebase config: pasted once, then carried in the link */
function encodeCfg(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeCfg(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function parseCfg(text){
  var o={},re=/([A-Za-z]+)\s*:\s*["']([^"']+)["']/g,m;
  while((m=re.exec(text)))o[m[1]]=m[2];
  return o.apiKey&&o.projectId?o:null;
}
function loadCfg(){
  var m=location.hash.match(/[#&]c=([^&]+)/);
  if(m){try{var o=decodeCfg(m[1]);if(o&&o.projectId&&o.apiKey){try{localStorage.setItem('df_fb',JSON.stringify(o))}catch(e){}return o}}catch(e){}}
  try{var s=localStorage.getItem('df_fb');if(s){var p=JSON.parse(s);if(p&&p.projectId)return p}}catch(e){}
  return null;
}

/* photos */
function compress(file){
  function toCanvas(src,w,hh){
    var s=Math.min(1,720/Math.max(w,hh)),cw=Math.round(w*s),ch=Math.round(hh*s);
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
    cv.getContext('2d').drawImage(src,0,0,cw,ch);return cv;
  }
  function encode(cv){var q=.6,u;do{u=cv.toDataURL('image/jpeg',q);q-=.08}while(u.length>150000&&q>.3);return u}
  if(window.createImageBitmap){
    return createImageBitmap(file).then(function(b){var u=encode(toCanvas(b,b.width,b.height));if(b.close)b.close();return u});
  }
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var u=encode(toCanvas(im,im.naturalWidth,im.naturalHeight));URL.revokeObjectURL(url);res(u)};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url;
  });
}
function loadPhoto(uid,d,kind){
  var k=uid+'/'+d+'/'+kind,c=photoCache.get(k);
  if(c)return Promise.resolve(c);
  return S.db.doc(P('checkins/'+uid+'/photos/'+d+'_'+kind)).get().then(function(s){
    var x=s.exists?s.data():null,v=x&&x.d?{d:x.d,ts:x.ts||0}:null;if(v)photoCache.set(k,v);return v;
  }).catch(function(){return null});
}
function timeLabel(ts){
  if(!ts)return '';
  var dt=new Date(ts),hm=pad(dt.getHours())+':'+pad(dt.getMinutes());
  return key(dt)===today()?'hoje '+hm:pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+' '+hm;
}
function photoImg(uid,d,kind,label){
  var img=h('img',{class:'ph',alt:label||'Foto'}),tm=h('span',{class:'tm'},''),box=h('div',{class:'phw'},img,tm);
  loadPhoto(uid,d,kind).then(function(p){
    if(p){img.src=p.d;tm.textContent=p.ts?'🕒 '+timeLabel(p.ts):'';tm.hidden=!p.ts;img.addEventListener('click',function(){open(p)})}
    else{img.alt='Foto indisponível';tm.hidden=true}
  });
  return box;
  function open(p){
    var lb=h('div',{class:'lb',onclick:function(){lb.remove()}},h('img',{src:p.d,alt:label||'Foto'}),p.ts?h('div',{class:'lbt'},(label?label+' · ':'')+'enviada '+timeLabel(p.ts)):null);
    document.body.appendChild(lb);
  }
}
function saveMeta(patch){
  var uid=S.uid,d=today(),cur=(S.metas[uid]||{})[d]||{};
  var next=Object.assign({date:d,w:false,m:false,type:'',note:''},cur,patch,{ts:Date.now()});
  var m={};m[d]=next;S.metas[uid]=Object.assign({},S.metas[uid]||{},m);
  var ref=S.db.doc(P('checkins/'+uid+'/days/'+d));
  metaQueue=metaQueue.then(function(){return ref.set(next)}).catch(function(){toast('Não foi possível salvar. Tente de novo.')});
  return metaQueue;
}
function resetVotes(owner,d,kind){
  var key=d+'_'+kind+'_'+owner,v=S.votes[key]||{};
  Object.keys(v).forEach(function(vid){if(v[vid])S.db.doc(P('votes/'+key+'_'+vid)).update({inv:false}).catch(function(){})});
}
function castVote(owner,d,kind,inv){
  var key=d+'_'+kind+'_'+owner;
  S.votes[key]=Object.assign({},S.votes[key]||{});S.votes[key][S.uid]=inv;render(true);
  S.db.doc(P('votes/'+key+'_'+S.uid)).set({d:d,k:kind,o:owner,v:S.uid,inv:inv,ts:Date.now()}).catch(function(){toast('Não consegui registrar o voto.')});
}
function photoVote(owner,d,kind,label){
  var el=eligible(owner,d),v=S.votes[d+'_'+kind+'_'+owner]||{},n=el.filter(function(i){return v[i]===true}).length,bad=invalid(owner,d,kind);
  var box=photoImg(owner,d,kind,label);
  if(bad)box.appendChild(h('span',{class:'inv'},'Invalidada'));
  var parts=[h('span',{class:'hint'},el.length<2?'Votação a partir de 3 pessoas':n+' de '+el.length+' votos para invalidar')];
  if(S.uid&&S.players[S.uid]&&owner!==S.uid&&el.indexOf(S.uid)>=0){
    var mine=v[S.uid]===true;
    parts.push(h('button',{class:'chip',type:'button','aria-pressed':String(mine),onclick:function(){castVote(owner,d,kind,!mine)}},mine?'Retirar meu voto':'Invalidar foto'));
  }
  return h('div',{class:'slot'},box,h('div',{class:'votes'},parts));
}
function uploadPhoto(kind,file){
  var uid=S.uid,d=today();
  S.busy[kind]=true;render(true);
  compress(file).then(function(url){
    return S.db.doc(P('checkins/'+uid+'/photos/'+d+'_'+kind)).set({d:url,ts:Date.now()}).then(function(){
      photoCache.set(uid+'/'+d+'/'+kind,{d:url,ts:Date.now()});
      resetVotes(uid,d,kind);var pt={};pt[kind]=true;return saveMeta(pt);
    });
  }).then(function(){toast('Foto salva')}).catch(function(){toast('Não consegui enviar a foto. Tente outra.')}).then(function(){S.busy[kind]=false;render(true)});
}

function prizeCard(rows,c,ph){
  var n=rows.length,top=rows[0].s.points,leaders=rows.filter(function(r){return r.s.points===top});
  var names=leaders.map(function(r){return r.p.name}).join(' e '),isMoney=TY().money;
  var msg,lead=ph==='after'?'Resultado final':'Se acabasse hoje';
  if(n<2)msg='Chame o pessoal para entrar. A disputa começa quando houver pelo menos duas pessoas.';
  else if(leaders.length===n)msg='Empate geral com '+top+' pontos.'+(isMoney?' Ninguém paga nada se terminar assim.':'');
  else if(!isMoney)msg=leaders.length===1?names+(ph==='after'?' venceu e leva a fama.':' está na frente. Vale só a fama, sem dinheiro.'):'Empate na frente entre '+names+'.';
  else if(leaders.length===1)msg=names+' ficaria com o prêmio. Cada perdedora paga '+money(c.stake)+', então '+names+' recebe '+money(c.stake*(n-1))+'.';
  else msg='Empate na frente entre '+names+'. Quem ficar atrás paga '+money(c.stake)+' a cada líder.';
  return h('section',{class:'card prize'},h('div',{class:'eyebrow'},lead),h('p',null,msg));

  });

function viewGraficos(){
  var c=cfg(),T=TY(),t=today(),end=cycleEnd(c),out=[];
  if(S.err)return [h('section',{class:'card'},h('h2',null,'Sem acesso ao banco'),h('p',{class:'muted'},'Confira as regras do Firestore e a internet.'))];
  if(!S.loaded.players)return [h('p',{class:'muted'},'Carregando...')];
  var ids=Object.keys(S.players);
  if(!ids.length)return [h('section',{class:'card'},h('h2',null,'Sem dados ainda'),h('p',{class:'muted'},'Os gráficos aparecem quando alguém entrar no desafio.'))];
  var last=addDays(t,-1);if(last>end)last=end;
  var days=[],d;for(d=c.start;d<=last;d=addDays(d,1))days.push(d);
  var rows=ids.map(function(id){
    var p=S.players[id],from=p.joined&&p.joined>c.start?p.joined:c.start,pts=[c.startPoints],cur=c.startPoints,ok=0,part=0,miss=0,photos=0,types={};
    days.forEach(function(day){
      if(day>=from){var pn=dayPenalty(eff(id,day),c);cur-=pn;if(pn===0)ok++;else if(pn<c.penalty)part++;else miss++}
      pts.push(Math.max(0,cur));

    Object.keys(mm).forEach(function(k){var m=mm[k]||{};T.k.forEach(function(x){if(m[x])photos++});if(m.type)types[m.type]=(types[m.type]||0)+1});
    return {id:id,p:p,pts:pts,ok:ok,part:part,miss:miss,photos:photos,types:types};
  }).sort(function(a,b){return b.pts[b.pts.length-1]-a.pts[a.pts.length-1]||(a.p.name||'').localeCompare(b.p.name||'')});

  /* 1. evolucao dos pontos */
  var c1=h('section',{class:'card'},h('h3',null,'Pontos dia a dia'));
  if(days.length<1){
    c1.appendChild(h('p',{class:'muted small'},'O gráfico de evolução aparece a partir do 2º dia do ciclo, quando o primeiro dia fecha.'));
  }else{
    var W=320,H=190,pl=30,pr=16,pt=12,pb=24,n=days.length,minV=c.startPoints;
    rows.forEach(function(r){r.pts.forEach(function(v){if(v<minV)minV=v})});
    var ymin=Math.max(0,Math.floor((minV-5)/10)*10),ymax=c.startPoints;if(ymax-ymin<10)ymin=ymax-10;
    var X=function(i){return pl+i*(W-pl-pr)/n},Y=function(v){return pt+(ymax-v)/(ymax-ymin)*(H-pt-pb)};
    var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chartsvg',role:'img','aria-label':'Gráfico de linhas: pontos de cada pessoa ao longo dos dias'});
    [ymin,Math.round((ymin+ymax)/2),ymax].forEach(function(g){
      svg.appendChild(sv('line',{x1:pl,x2:W-pr,y1:Y(g),y2:Y(g),stroke:'var(--line)','stroke-width':1}));
      svg.appendChild(txt(pl-4,Y(g)+3,String(g),'end'));
    });
    svg.appendChild(txt(pl,H-6,fmt(c.start),'start'));
    svg.appendChild(txt(W-pr,H-6,fmt(days[n-1]),'end'));
    rows.forEach(function(r){
      var col=color(r.p),pts=r.pts.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
      svg.appendChild(sv('polyline',{points:pts,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
      var lv=r.pts[n];
      svg.appendChild(sv('circle',{cx:X(n),cy:Y(lv),r:4,fill:col,stroke:'var(--surface)','stroke-width':2}));
    });
    rows.forEach(function(r){
      r.pts.forEach(function(v,i){
        var tip=sv('title',{});tip.textContent=(r.p.name||'')+' · '+(i===0?'início':'até '+fmt(days[i-1]))+' · '+num(v)+' pontos';
        svg.appendChild(sv('circle',{cx:X(i),cy:Y(v),r:9,fill:'transparent'},[tip]));
      });
    });
    c1.appendChild(svg);
    c1.appendChild(h('div',{class:'lg'},rows.map(function(r){
      return h('span',null,h('i',{style:'background:'+color(r.p)}),(r.p.name||'')+' '+num(r.pts[n]));
    })));
    var tb=h('table',{class:'tb'},h('thead',null,h('tr',null,h('th',null,'Dia'),rows.map(function(r){return h('th',null,r.p.name||'')}))),
      h('tbody',null,days.map(function(day,i){return h('tr',null,h('td',null,fmt(day)),rows.map(function(r){return h('td',null,num(r.pts[i+1]))}))})));
    c1.appendChild(h('details',null,h('summary',null,'Ver como tabela'),h('div',{style:'overflow-x:auto;margin-top:8px'},tb)));
  }
  out.push(c1);

  /* 2. dias: completo / metade / falta */
  var c2=h('section',{class:'card'},h('h3',null,'Como foram os dias'));
  if(!days.length)c2.appendChild(h('p',{class:'muted small'},'Aparece quando o primeiro dia fechar.'));
  else{
    rows.forEach(function(r){
      var tot=r.ok+r.part+r.miss;
      c2.appendChild(h('div',{class:'grow'},
        h('div',{class:'row between small',style:'margin-bottom:4px'},h('span',{class:'row'},avatar(r.p,20),h('b',null,r.p.name||'')),h('span',{class:'muted'},r.ok+' completos · '+r.part+' parciais · '+r.miss+' faltas')),
        tot?h('div',{class:'sbar'},
          r.ok?h('i',{style:'flex:'+r.ok+';background:var(--ok)',title:r.ok+' dias completos'}):null,
          r.part?h('i',{style:'flex:'+r.part+';background:var(--warn)',title:r.part+' dias com '+T.partTxt.toLowerCase()}):null,
          r.miss?h('i',{style:'flex:'+r.miss+';background:var(--miss)',title:r.miss+' faltas'}):null):h('div',{class:'muted small'},'Sem dias fechados ainda.')));
    });
    c2.appendChild(h('div',{class:'lg'},
      h('span',null,h('i',{class:'sq',style:'background:var(--ok)'}),'Dia completo'),
      h('span',null,h('i',{class:'sq',style:'background:var(--warn)'}),T.partTxt),
      h('span',null,h('i',{class:'sq',style:'background:var(--miss)'}),'Falta')));
  }
  out.push(c2);

  /* 3. fotos enviadas */
  var mx=Math.max.apply(null,rows.map(function(r){return r.photos}).concat([1]));
  out.push(h('section',{class:'card'},h('h3',null,'Fotos enviadas'),
    rows.map(function(r){
      return h('div',{class:'hb'},h('span',{class:'hl'},r.p.name||''),
        h('div',{class:'hv'},h('div',{class:'hbar',style:'width:'+Math.round(r.photos/mx*100)+'%;background:'+color(r.p),title:r.photos+' fotos'})),
        h('span',{class:'hn'},String(r.photos)));
    })));

  /* 4. onde treinamos (so desafio de academia) */
  if(T.money){
    var tot={};rows.forEach(function(r){Object.keys(r.types).forEach(function(k){tot[k]=(tot[k]||0)+r.types[k]})});
    var keys=Object.keys(tot).sort(function(a,b){return tot[b]-tot[a]}),m2=Math.max.apply(null,keys.map(function(k){return tot[k]}).concat([1]));
    out.push(h('section',{class:'card'},h('h3',null,'Onde treinamos'),
      keys.length?keys.map(function(k){
        return h('div',{class:'hb'},h('span',{class:'hl'},k),h('div',{class:'hv'},h('div',{class:'hbar',style:'width:'+Math.round(tot[k]/m2*100)+'%',title:tot[k]+' treinos'})),h('span',{class:'hn'},String(tot[k])));
      }):h('p',{class:'muted small'},'Marque onde foi o treino na aba Hoje e aparece aqui.')));
  }
  return out;
}

/* shell */
function render(force){
  var root=document.getElementById('app');if(!root)return;
  var ae=document.activeElement;
  if(!force&&ae&&root.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.type!=='checkbox'&&ae.type!=='file'){pending=true;return}
  if(force&&ae&&root.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.type!=='checkbox'&&ae.type!=='file'&&S.tab==='hoje'){ae.blur()}
  pending=false;
  var me=S.players[S.uid],T=TY(),pr=prof();
  var title=CH===null?'Desafio Fit':((S.cfg&&S.cfg.name)||(entry(CH)||{}).name||'Desafio Fit');
  var sub=S.db&&me?'Oi, '+(me.name||'')+'. '+T.hello:(S.db&&CH===null?'Crie ou entre em um desafio':'Fotos diárias, pontos e placar');
  var body;
  if(!S.db)body=setupView();
  else if(CH===null)body=emptyView();
  else if(!S.loaded.cfg)body=[h('p',{class:'muted'},'Carregando...')];
  else if(CH&&!S.cfg)body=[notFound()];
  else body=S.tab==='hoje'?viewHoje():S.tab==='galeria'?viewGaleria():S.tab==='graficos'?viewGraficos():S.tab==='regras'?viewRegras():viewPlacar();
  if(S.oldLink)body=[h('section',{class:'card'},h('h3',null,'Link antigo'),h('p',{class:'muted small'},'Por segurança, o link antigo foi desativado. Peça o novo link do desafio a quem criou e abra por ele (ou cole em Entrar com link ou código).'),h('button',{class:'btn ghost',type:'button',onclick:function(){S.oldLink=false;render(true)}},'Entendi'))].concat(body);
  var who=me||{name:pr.name,av:pr.av,color:pr.color};
  root.replaceChildren(
    h('header',{class:'top'},h('div',{class:'tt'},h('h1',null,title),h('p',{class:'sub'},sub)),
      S.db?h('button',{class:'profbtn',type:'button','aria-label':'Perfil e trocar desafio',onclick:function(){S.sheet=true;S.sheetView='main';render(true)}},avatar(who,48)):null),
    h('main',{class:'wrap',style:'padding:0'},body));
  var old=document.getElementById('nav-host');if(old)old.remove();
  if(S.db&&CH!==null){
    var tabs=[['placar','Placar','trophy'],['hoje','Hoje','camera'],['galeria','Galeria','grid'],['graficos','Gráficos','chart'],['regras','Regras','list']];
    document.body.appendChild(h('div',{id:'nav-host'},h('nav',{class:'nav','aria-label':'Seções'},h('div',{class:'nav-in'},tabs.map(function(t){
      return h('button',{class:'tab',type:'button','aria-current':S.tab===t[0]?'page':null,onclick:function(){setTab(t[0])}},icon(t[2]),t[1]);
    })))));
  }
  var sh=document.getElementById('sheet-host');
  if(!S.sheet||!S.db){if(sh)sh.remove()}
  else if(force||!sh){if(sh)sh.remove();var nb=sheetView();nb.id='sheet-host';document.body.appendChild(nb)}
  var tt=document.getElementById('toast-host');if(tt)tt.remove();
  if(S.toast)document.body.appendChild(h('div',{id:'toast-host',class:'toast',role:'status'},S.toast));
}

/* data */
function ensureSubs(){
  var ch=CH;
  Object.keys(S.players).forEach(function(uid){
    if(subs[uid])return;
    subs[uid]=true;
    unsubs.push(S.db.collection(P('checkins/'+uid+'/days')).onSnapshot(function(snap){
      if(ch!==CH)return;
      var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});
      if(uid===S.uid){var cur=S.metas[uid]||{};Object.keys(cur).forEach(function(k){if(!m[k]&&cur[k]&&Date.now()-(cur[k].ts||0)<5000)m[k]=cur[k]})}
      S.metas[uid]=m;render();
    },function(){}));
  });
}
function boot(){
  FBCFG=loadCfg();
  if(FBCFG&&!window.firebase){S.setupErr='Não consegui carregar o Firebase. Confira a internet e abra o link de novo.';FBCFG=null}
  if(!FBCFG){render(true);return}
  try{
    firebase.initializeApp(FBCFG);
    S.db=firebase.firestore();
    try{S.db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
  }catch(e){S.db=null;S.setupErr='A configuração do Firebase parece inválida. Cole de novo.';try{localStorage.removeItem('df_fb')}catch(e2){}render(true);return}
  initList();
  try{if(location.hash&&lsGet('df_fb'))history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  connect();
}
lastDay=today();
setInterval(function(){
  var t=today();
  if(t!==lastDay){lastDay=t;S.galDate=null;render(true)}
  else if(pending)render();
},60000);
boot();
})();
</script>
